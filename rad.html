<!DOCTYPE html>
<html lang="fa" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>هاست کپی خور تا ۱۳.۵۲</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%;
    background:#0b0d10 url("rad.jpg") center center / cover no-repeat fixed;
    color:#e8edf5;
    font-family:'Vazirmatn', Tahoma, "Segoe UI", system-ui, sans-serif;
    font-size:13px; line-height:1.7;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  body::after {
    content:""; position:fixed; inset:0; z-index:0;
    background: radial-gradient(circle at 50% 40%,
      rgba(0,0,0,0.10) 0%,
      rgba(0,0,0,0.55) 65%,
      rgba(0,0,0,0.88) 100%);
    pointer-events:none;
  }

  /* ===== فقط گوشه راست بالا ===== */
  #hint {
    position:fixed; top:18px; right:18px; z-index:2;
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:600; color:#dfe8f5;
    background:rgba(15,19,26,0.55);
    padding:8px 16px; border-radius:99px;
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    text-shadow:0 1px 3px rgba(0,0,0,.5);
    white-space:nowrap;
    animation:pulse 2.2s ease-in-out infinite;
  }
  #hint .key {
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    font-weight:700; font-size:12px; color:#fff;
  }
  @keyframes pulse {
    0%,100% { opacity:.65; }
    50% { opacity:1; }
  }

  /* حالت اجرا شده: رنگ سبز */
  .done #hint {
    color:#7bf0a9;
    border-color:rgba(61,220,132,0.35);
    animation:none;
    opacity:1;
  }
  .done #hint .key { display:none; }
</style>
</head>
<body>

<div id="hint">
  <span class="key">X</span>
  <span>لطفاً X را بزنید</span>
</div>

<iframe id="exploitFrame" src="about:blank"
        style="position:fixed;width:1px;height:1px;opacity:0;border:0;pointer-events:none;left:-9999px;top:-9999px;"></iframe>

<script>
(function () {
    var hintEl = document.getElementById("hint");
    var body = document.body;
    var started = false;

    function launch() {
        if (started) return;
        started = true;

        hintEl.innerHTML = '<span>در حال اجرای جیلبریک...</span>';

        var f = document.getElementById("exploitFrame");
        f.src = "jb.html" + location.search;

        setTimeout(function () {
            body.classList.add("done");
            hintEl.innerHTML = '<span>گولدهن اجرا شد ✓</span>';
        }, 6000);
    }

    window.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.keyCode === 13 || e.keyCode === 32) {
            e.preventDefault();
            launch();
        }
    });

    document.addEventListener("click", function (e) {
        e.preventDefault();
        launch();
    });
})();
</script>
</body>
</html>
